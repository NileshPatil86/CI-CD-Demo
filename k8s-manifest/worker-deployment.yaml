apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Pull-only ACR token (scope map: votting-app-pull).
      # Secret is created by the deploy workflow / see README notes.
      imagePullSecrets:
      - name: acr-pull-secret
      containers:
      - image: vottingapp01.azurecr.io/worker:latest
        name: worker
