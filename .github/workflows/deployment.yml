name: Deploy to AKS (k8s-manifest)

# --------------------------------------------------------------------------
# Manual deploy. Run it from the Actions tab and pick the image tag you want
# (defaults to "latest", which the build workflow always pushes).
# --------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag in ACR to deploy (e.g. latest or a git SHA)'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: vottingapp01.azurecr.io   # your ACR login server
  RESOURCE_GROUP: Nitor-Internal-POC          # resource group containing the AKS cluster
  CLUSTER_NAME: nitor-dev-aks                 # AKS cluster name
  NAMESPACE: votting-app                      # namespace to deploy into

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # The manifests pin ":latest". Rewrite just the tag so a run can deploy a
      # specific SHA. db and redis keep their public images (postgres / redis).
      - name: Point manifests at the chosen tag
        run: |
          TAG="${{ inputs.image_tag }}"
          cd k8s-manifest
          for svc in vote result worker; do
            sed -i "s|image: ${ACR_LOGIN_SERVER}/${svc}:.*|image: ${ACR_LOGIN_SERVER}/${svc}:${TAG}|" "${svc}-deployment.yaml"
          done
          echo "--- images to be deployed ---"
          grep -h "image:" *.yaml

      # Safe to re-run: creates the namespace only if it is missing.
      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # The AKS kubelet identity has no AcrPull role on the registry, so pods
      # authenticate with a pull-only ACR token instead (scope map
      # "votting-app-pull", read-only on vote/result/worker).
      # Requires repo secret ACR_PULL_TOKEN_PASSWORD.
      # Recreated every run so a fresh namespace or a rotated token still works.
      - name: Create ACR pull secret
        run: |
          kubectl create secret docker-registry acr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username=votting-app-pull-token \
            --docker-password="${{ secrets.ACR_PULL_TOKEN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: kubectl apply -f k8s-manifest/ -n "$NAMESPACE"

      - name: Wait for rollouts
        run: |
          for d in db redis vote result worker; do
            echo "==> waiting for deployment/$d"
            kubectl rollout status deployment/"$d" -n "$NAMESPACE" --timeout=180s
          done

      - name: Show what is running
        run: |
          kubectl get deploy,svc,pods -n "$NAMESPACE" -o wide
