name: Deploy to AKS (k8s-manifest)

# --------------------------------------------------------------------------
# Manual deploy. Run it from the Actions tab and pick the image tag you want
# (defaults to "latest", which the build workflow always pushes).
# --------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag in ACR to deploy (e.g. latest or a git SHA)'
        required: true
        default: 'latest'

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: vottingapp01.azurecr.io   # your ACR login server
  RESOURCE_GROUP: Nitor-Internal-POC          # resource group containing the AKS cluster
  CLUSTER_NAME: nitor-dev-aks                 # AKS cluster name
  NAMESPACE: votting-app-2                      # namespace to deploy into

  # ---- Email notification (SMTP) -----------------------------------------
  # Non-secret SMTP settings live here; credentials live in repo secrets.
  #   Gmail        -> smtp.gmail.com   port 465 (secure true)
  #   Office365    -> smtp.office365.com port 587 (set MAIL_SECURE to false)
  #   SendGrid     -> smtp.sendgrid.net  port 465 (username is the literal
  #                   string "apikey", password is the API key)
  MAIL_SERVER: smtp.gmail.com
  MAIL_PORT: "465"
  MAIL_SECURE: "true"                         # true for port 465 (SSL), false for 587 (STARTTLS)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # The manifests pin ":latest". Rewrite just the tag so a run can deploy a
      # specific SHA. db and redis keep their public images (postgres / redis).
      - name: Point manifests at the chosen tag
        run: |
          TAG="${{ inputs.image_tag }}"
          cd k8s-manifest
          for svc in vote result worker; do
            sed -i "s|image: ${ACR_LOGIN_SERVER}/${svc}:.*|image: ${ACR_LOGIN_SERVER}/${svc}:${TAG}|" "${svc}-deployment.yaml"
          done
          echo "--- images to be deployed ---"
          grep -h "image:" *.yaml

      # Safe to re-run: creates the namespace only if it is missing.
      - name: Ensure namespace exists
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # Postgres credentials live only in this Secret — never in the manifests,
      # never in the image. POSTGRES_PASSWORD falls back to "postgres" so a POC
      # cluster still comes up, but set the repo secret for anything real.
      - name: Create database credentials secret
        env:
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          DB_USER=postgres
          DB_PASSWORD="${DB_PASSWORD:-postgres}"
          if [ "$DB_PASSWORD" = "postgres" ]; then
            echo "::warning::POSTGRES_PASSWORD repo secret is not set; falling back to the default password."
          fi
          kubectl create secret generic db-credentials \
            --namespace "$NAMESPACE" \
            --from-literal=username="$DB_USER" \
            --from-literal=password="$DB_PASSWORD" \
            --from-literal=database-url="postgres://${DB_USER}:${DB_PASSWORD}@db/postgres" \
            --dry-run=client -o yaml | kubectl apply -f -

      # The AKS kubelet identity has no AcrPull role on the registry, so pods
      # authenticate with a pull-only ACR token instead (scope map
      # "votting-app-pull", read-only on vote/result/worker).
      #
      # This step is deliberately self-healing and non-destructive:
      #   - if the in-cluster secret already authenticates, leave it alone
      #   - otherwise fall back to ACR_PULL_TOKEN_PASSWORD, but only after
      #     checking that ACR actually accepts it
      # It never overwrites a working secret with an unverified value, which is
      # what previously broke image pulls for every newly created pod.
      - name: Ensure ACR pull secret is valid
        env:
          TOKEN_PASSWORD: ${{ secrets.ACR_PULL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail

          acr_accepts() {
            local pw="$1" code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -u "votting-app-pull-token:${pw}" \
              "https://${ACR_LOGIN_SERVER}/oauth2/token?scope=repository%3Avote%3Apull&service=${ACR_LOGIN_SERVER}")
            [ "$code" = "200" ]
          }

          # What is already in the cluster?
          existing=$(kubectl get secret acr-pull-secret -n "$NAMESPACE" \
            -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            current=$(printf '%s' "$existing" | base64 -d \
              | jq -r --arg s "$ACR_LOGIN_SERVER" '.auths[$s].password // empty')
            if [ -n "$current" ] && acr_accepts "$current"; then
              echo "acr-pull-secret already authenticates against ACR. Leaving it untouched."
              exit 0
            fi
          fi

          echo "No working acr-pull-secret in namespace $NAMESPACE."

          if [ -z "${TOKEN_PASSWORD:-}" ]; then
            echo "::error::Cluster has no valid pull secret and repo secret ACR_PULL_TOKEN_PASSWORD is not set. Set it, or create the secret manually (see RUNBOOK.md section 5)."
            exit 1
          fi

          if ! acr_accepts "$TOKEN_PASSWORD"; then
            echo "::error::ACR rejected ACR_PULL_TOKEN_PASSWORD. Fix the repo secret or rotate the token (see RUNBOOK.md section 8). Nothing was written to the cluster."
            exit 1
          fi

          kubectl create secret docker-registry acr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username=votting-app-pull-token \
            --docker-password="$TOKEN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "acr-pull-secret created from ACR_PULL_TOKEN_PASSWORD (verified against ACR)."

      - name: Apply manifests
        run: kubectl apply -f k8s-manifest/ -n "$NAMESPACE"

      - name: Wait for rollouts
        run: |
          # db and redis are StatefulSets with persistent disks. Allow longer —
          # on a new namespace the Azure Disk has to be provisioned and attached
          # before the pod can start.
          for s in db redis; do
            echo "==> waiting for statefulset/$s"
            kubectl rollout status statefulset/"$s" -n "$NAMESPACE" --timeout=300s
          done

          for d in vote result worker; do
            echo "==> waiting for deployment/$d"
            kubectl rollout status deployment/"$d" -n "$NAMESPACE" --timeout=180s
          done

      - name: Show what is running
        run: |
          kubectl get statefulset,deploy,svc,pods,pvc -n "$NAMESPACE" -o wide

  # ==========================================================================
  # JOB 2 — Email notification (always runs, reports SUCCESS or FAILURE)
  #
  # "if: always()" is what makes this job run even when the deploy fails —
  # without it GitHub skips downstream jobs on failure and no mail is sent.
  #
  # On success  -> green "deploy successful" mail with the tag / cluster /
  #                namespace that was rolled out.
  # On failure  -> red mail naming the step that failed (bad pull secret,
  #                rollout timeout, ...) plus the tail of the job log, so the
  #                actual error text is in the email body.
  #
  # 🔑 REQUIRED REPO SECRETS (Settings > Secrets and variables > Actions):
  #   MAIL_USERNAME  SMTP login  (e.g. [REDACTED_EMAIL_ADDRESS_2])
  #   MAIL_PASSWORD  SMTP password — for Gmail this MUST be a 16-char
  #                  "App password", not your normal account password.
  #   MAIL_TO        recipient(s), comma-separated for several people.
  # Non-secret server/port/secure values are in the env: block at the top.
  # ==========================================================================
  notify:
    name: Email notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read        # required to read this run's job results and logs
    steps:
      - name: Build email subject and body
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -uo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Minimal HTML escaping so log text can't break the email markup.
          html_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          if [ "$DEPLOY_RESULT" = "success" ]; then
            SUBJECT="✅ SUCCESS - Deploy to AKS - ${NAMESPACE} @ tag ${IMAGE_TAG} (run #${GITHUB_RUN_NUMBER})"
            COLOR="#1a7f37"
            HEADLINE="Deploy successful"
            MESSAGE="<b>vote</b>, <b>result</b> and <b>worker</b> at tag <code>${IMAGE_TAG}</code> were applied to namespace <code>${NAMESPACE}</code> on cluster <code>${CLUSTER_NAME}</code>, and all StatefulSet / Deployment rollouts completed."
            DETAILS=""
          else
            SUBJECT="❌ FAILED - Deploy to AKS - ${NAMESPACE} @ tag ${IMAGE_TAG} (run #${GITHUB_RUN_NUMBER})"
            COLOR="#cf222e"
            HEADLINE="Deploy failed"
            MESSAGE="The deploy finished with result <b>${DEPLOY_RESULT}</b>. The step that failed and the end of its log are below. The cluster may be in a partially rolled-out state — check the run before retrying."

            # List every failed job in this run attempt: "<job id>\t<job name>"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
              --paginate \
              --jq '.jobs[] | select(.conclusion=="failure") | [.id, .name] | @tsv' \
              > failed_jobs.tsv < /dev/null 2>/dev/null

            DETAILS=""
            while IFS=$'\t' read -r JOB_ID JOB_NAME; do
              if [ -z "${JOB_ID:-}" ]; then continue; fi

              FAILED_STEPS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}" \
                --jq '[.steps[]? | select(.conclusion=="failure") | .name] | join(", ")' \
                < /dev/null 2>/dev/null)
              if [ -z "${FAILED_STEPS:-}" ]; then FAILED_STEPS="(step name unavailable)"; fi

              # Last 40 log lines of the failed job == the actual error text.
              # GitHub masks registered secrets as *** in these logs.
              LOG_TAIL=$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
                < /dev/null 2>/dev/null | tail -n 40 | html_escape)
              if [ -z "${LOG_TAIL:-}" ]; then
                LOG_TAIL="(log output unavailable — open the run link above)"
              fi

              DETAILS="${DETAILS}<h3 style=\"margin:24px 0 4px;font-size:15px;\">${JOB_NAME}</h3><p style=\"margin:0 0 8px;\"><b>Failed step:</b> ${FAILED_STEPS}</p><pre style=\"background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:12px;font-size:12px;line-height:1.45;overflow-x:auto;white-space:pre-wrap;\">${LOG_TAIL}</pre>"
            done < failed_jobs.tsv

            if [ -z "${DETAILS:-}" ]; then
              DETAILS="<p>No individual failed job could be read back from the API (the run may have been cancelled or timed out). Open the run link above for the full logs.</p>"
            fi
          fi

          cat > body.html <<HTML
          <div style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1f2328;max-width:760px;">
            <h2 style="color:${COLOR};margin:0 0 12px;">${HEADLINE}</h2>
            <p style="margin:0 0 16px;">${MESSAGE}</p>
            <table cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
              <tr><td style="color:#57606a;">Repository</td><td><b>${GITHUB_REPOSITORY}</b></td></tr>
              <tr><td style="color:#57606a;">Workflow</td><td>${GITHUB_WORKFLOW} — run #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})</td></tr>
              <tr><td style="color:#57606a;">Image tag</td><td><code>${IMAGE_TAG}</code></td></tr>
              <tr><td style="color:#57606a;">Cluster</td><td>${CLUSTER_NAME} (${RESOURCE_GROUP})</td></tr>
              <tr><td style="color:#57606a;">Namespace</td><td>${NAMESPACE}</td></tr>
              <tr><td style="color:#57606a;">Branch / ref</td><td>${GITHUB_REF_NAME}</td></tr>
              <tr><td style="color:#57606a;">Commit</td><td><a href="${COMMIT_URL}">${SHORT_SHA}</a></td></tr>
              <tr><td style="color:#57606a;">Triggered by</td><td>${GITHUB_ACTOR} (${GITHUB_EVENT_NAME})</td></tr>
              <tr><td style="color:#57606a;">Result</td><td><b style="color:${COLOR};">${DEPLOY_RESULT}</b></td></tr>
            </table>
            <p style="margin:16px 0;"><a href="${RUN_URL}" style="background:${COLOR};color:#ffffff;padding:9px 16px;border-radius:6px;text-decoration:none;display:inline-block;">View full logs on GitHub</a></p>
            ${DETAILS}
          </div>
          HTML

          {
            echo "subject=${SUBJECT}"
            echo "body<<__CI_EMAIL_BODY__"
            cat body.html
            echo "__CI_EMAIL_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.MAIL_SERVER }}
          server_port: ${{ env.MAIL_PORT }}
          secure: ${{ env.MAIL_SECURE }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.report.outputs.subject }}
          html_body: ${{ steps.report.outputs.body }}
          convert_markdown: false
